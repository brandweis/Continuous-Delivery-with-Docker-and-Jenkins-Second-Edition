apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: bitnami/mongodb:7.0.5
          ports:
            - containerPort: 27017
          env:
            - name: MONGODB_ROOT_USER
              value: root
            - name: MONGODB_ROOT_PASSWORD
              value: bitnamipassword
            - name: MONGODB_DATABASE
              value: admin
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: prometheus
spec:
  selector:
    app: mongodb
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017

